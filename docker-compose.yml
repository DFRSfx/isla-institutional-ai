services:
  db:
    image: postgres:16-alpine
    container_name: isla_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isla_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
      POSTGRES_DB: ${POSTGRES_DB:-isla_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isla_ai} -d ${POSTGRES_DB:-isla_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isla_ai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-isla_ai}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}@db:5432/${POSTGRES_DB:-isla_ai}
      REPORTS_OUTPUT_DIR: /app/reports_output
      LLM_BASE_URL: http://ollama:11434/v1
    volumes:
      - reports_data:/app/reports_output
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isla_ai_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # LLM local on-premise (RGPD/NIS2)
  ollama:
    image: ollama/ollama:latest
    container_name: isla_ai_ollama
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  reports_data:
  ollama_models:
