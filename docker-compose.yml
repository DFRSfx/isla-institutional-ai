services:
  db:
    image: postgres:16-alpine
    container_name: isla_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isla_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isla_ai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-isla_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isla_ai} -d ${POSTGRES_DB:-isla_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isla_ai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-isla_ai}:${POSTGRES_PASSWORD:-isla_ai_dev}@db:5432/${POSTGRES_DB:-isla_ai}
    ports:
      - "${BACKEND_PORT:-8001}:8000"

volumes:
  postgres_data:
